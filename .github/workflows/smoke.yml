# Checks the live site after every push to main (once Cloudflare has deployed that exact commit),
# and once a day to catch drift: expired certificates or security.txt, dashboard changes, and
# Cloudflare-side regressions. Failures appear as annotations on the run.
name: Production smoke test

on:
  push:
    branches: [main]
  schedule:
    - cron: "17 3 * * *" # daily, 08:47 IST
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: smoke
  cancel-in-progress: true

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - name: Wait for Cloudflare to deploy this commit
        if: github.event_name == 'push'
        run: |
          for i in $(seq 1 60); do
            live=$(curl -fsS --max-time 10 "https://jayantgoswami.com/version.json?nocache=$RANDOM" | grep -oE '"commit":"[0-9a-f]+"' | cut -d'"' -f4 || true)
            echo "attempt $i: live commit=${live:-none}, waiting for ${GITHUB_SHA}"
            [[ "$live" == "$GITHUB_SHA" ]] && exit 0
            sleep 15
          done
          echo "::error title=Smoke test::Commit ${GITHUB_SHA} was not live after 15 minutes. Check the Cloudflare Pages build."
          exit 1
      - run: bash scripts/smoke.sh https://jayantgoswami.com
