<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000" preserveAspectRatio="xMidYMid slice" aria-hidden="true">
  <!-- Background illustration: scattered problems (left) flow through an AI core (centre)
       and come out as structured products (right). Decorative only; no scripts. -->
  <defs>
    <radialGradient id="core" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#60a5fa" stop-opacity=".9"/>
      <stop offset=".6" stop-color="#34d399" stop-opacity=".35"/>
      <stop offset="1" stop-color="#34d399" stop-opacity="0"/>
    </radialGradient>
    <path id="in1" d="M150 220 C 420 220, 560 430, 800 500"/>
    <path id="in2" d="M90 520 C 380 540, 560 500, 800 500"/>
    <path id="in3" d="M200 820 C 440 800, 600 590, 800 500"/>
    <path id="in4" d="M330 380 C 520 420, 640 470, 800 500"/>
    <path id="out1" d="M800 500 C 1000 430, 1110 300, 1240 300"/>
    <path id="out2" d="M800 500 C 1000 500, 1110 500, 1240 500"/>
    <path id="out3" d="M800 500 C 1000 570, 1110 700, 1240 700"/>
  </defs>

  <!-- connecting paths -->
  <g fill="none" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="4 10" opacity=".55">
    <use href="#in1"/><use href="#in2"/><use href="#in3"/><use href="#in4"/>
    <use href="#out1"/><use href="#out2"/><use href="#out3"/>
  </g>

  <!-- PROBLEMS: scattered, irregular, drifting -->
  <g fill="#f59e0b">
    <circle cx="150" cy="220" r="10"><animate attributeName="cy" values="220;206;220" dur="6s" repeatCount="indefinite"/></circle>
    <circle cx="90" cy="520" r="7"><animate attributeName="cx" values="90;104;90" dur="7s" repeatCount="indefinite"/></circle>
    <circle cx="200" cy="820" r="12"><animate attributeName="cy" values="820;836;820" dur="8s" repeatCount="indefinite"/></circle>
    <circle cx="330" cy="380" r="6"><animate attributeName="cx" values="330;316;330" dur="5s" repeatCount="indefinite"/></circle>
    <circle cx="260" cy="640" r="5" fill="#ef4444"><animate attributeName="cy" values="640;628;640" dur="6.5s" repeatCount="indefinite"/></circle>
    <circle cx="60" cy="300" r="4" fill="#ef4444"><animate attributeName="cx" values="60;72;60" dur="5.5s" repeatCount="indefinite"/></circle>
  </g>
  <g fill="#f59e0b" font-family="Helvetica, Arial, sans-serif" font-weight="700" opacity=".8">
    <text x="118" y="170" font-size="40">?</text>
    <text x="300" y="560" font-size="30">?</text>
    <text x="150" y="740" font-size="34">?</text>
  </g>

  <!-- AI CORE: pulsing, with orbiting rings -->
  <circle cx="800" cy="500" r="150" fill="url(#core)">
    <animate attributeName="r" values="140;165;140" dur="4s" repeatCount="indefinite"/>
  </circle>
  <g fill="none" stroke="#60a5fa" stroke-width="2" opacity=".7">
    <ellipse cx="800" cy="500" rx="110" ry="42">
      <animateTransform attributeName="transform" type="rotate" from="0 800 500" to="360 800 500" dur="18s" repeatCount="indefinite"/>
    </ellipse>
    <ellipse cx="800" cy="500" rx="110" ry="42" stroke="#34d399">
      <animateTransform attributeName="transform" type="rotate" from="60 800 500" to="420 800 500" dur="24s" repeatCount="indefinite"/>
    </ellipse>
  </g>
  <circle cx="800" cy="500" r="34" fill="#60a5fa" opacity=".9"/>
  <text x="800" y="512" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="32" font-weight="800" fill="#ffffff">AI</text>

  <!-- PRODUCTS: structured, aligned blocks that light up in sequence -->
  <g>
    <rect x="1240" y="270" width="120" height="60" rx="12" fill="#34d399" opacity=".35"><animate attributeName="opacity" values=".25;.8;.25" dur="6s" begin="0s" repeatCount="indefinite"/></rect>
    <rect x="1380" y="270" width="120" height="60" rx="12" fill="#60a5fa" opacity=".35"><animate attributeName="opacity" values=".25;.8;.25" dur="6s" begin="1s" repeatCount="indefinite"/></rect>
    <rect x="1240" y="470" width="120" height="60" rx="12" fill="#60a5fa" opacity=".35"><animate attributeName="opacity" values=".25;.8;.25" dur="6s" begin="2s" repeatCount="indefinite"/></rect>
    <rect x="1380" y="470" width="120" height="60" rx="12" fill="#34d399" opacity=".35"><animate attributeName="opacity" values=".25;.8;.25" dur="6s" begin="3s" repeatCount="indefinite"/></rect>
    <rect x="1240" y="670" width="120" height="60" rx="12" fill="#34d399" opacity=".35"><animate attributeName="opacity" values=".25;.8;.25" dur="6s" begin="4s" repeatCount="indefinite"/></rect>
    <rect x="1380" y="670" width="120" height="60" rx="12" fill="#60a5fa" opacity=".35"><animate attributeName="opacity" values=".25;.8;.25" dur="6s" begin="5s" repeatCount="indefinite"/></rect>
  </g>
  <g stroke="#ffffff" stroke-width="3" stroke-linecap="round" opacity=".7">
    <path d="M1262 300 h40 M1402 300 h56 M1262 500 h56 M1402 500 h40 M1262 700 h48 M1402 700 h52"/>
  </g>

  <!-- PARTICLES: problems travel into AI (amber), products come out (green/blue) -->
  <g>
    <circle r="6" fill="#f59e0b"><animateMotion dur="5s" repeatCount="indefinite"><mpath href="#in1"/></animateMotion></circle>
    <circle r="5" fill="#f59e0b"><animateMotion dur="6s" begin="1.2s" repeatCount="indefinite"><mpath href="#in2"/></animateMotion></circle>
    <circle r="6" fill="#ef4444"><animateMotion dur="5.5s" begin="2.4s" repeatCount="indefinite"><mpath href="#in3"/></animateMotion></circle>
    <circle r="4" fill="#f59e0b"><animateMotion dur="4.5s" begin="0.6s" repeatCount="indefinite"><mpath href="#in4"/></animateMotion></circle>
    <circle r="6" fill="#34d399"><animateMotion dur="4s" begin="0.8s" repeatCount="indefinite"><mpath href="#out1"/></animateMotion></circle>
    <circle r="6" fill="#60a5fa"><animateMotion dur="4s" begin="2s" repeatCount="indefinite"><mpath href="#out2"/></animateMotion></circle>
    <circle r="6" fill="#34d399"><animateMotion dur="4s" begin="3.2s" repeatCount="indefinite"><mpath href="#out3"/></animateMotion></circle>
  </g>

  <!-- the message -->
  <g font-family="Helvetica, Arial, sans-serif" font-size="22" font-weight="700" letter-spacing="4" fill="#94a3b8" text-anchor="middle" opacity=".9">
    <text x="210" y="930">PROBLEMS</text>
    <text x="800" y="930">AI</text>
    <text x="1370" y="930">PRODUCTS</text>
  </g>
</svg>
